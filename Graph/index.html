<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Graph</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Mobile OS Usage 2569</h1>
        </div>


        <div class="graph-box">

            <h2>Vertical Bar Graph</h2>

            <div class="vertical">

                <div class="column">
                    <div class="percent">70%</div>
                    <div class="vbar android-v"></div>
                    <p>Android</p>
                </div>

                <div class="column">
                    <div class="percent">20%</div>
                    <div class="vbar ios-v"></div>
                    <p>iOS</p>
                </div>

                <div class="column">
                    <div class="percent">5%</div>
                    <div class="vbar windows-v"></div>
                    <p>Windows</p>
                </div>

                <div class="column">
                    <div class="percent">5%</div>
                    <div class="vbar other-v"></div>
                    <p>Other</p>
                </div>

            </div>

        </div>



        <div class="graph-box">

            <h2>Horizontal Bar Graph</h2>


            <div class="bar-row">
                <div class="label">Android</div>
                <div class="bar android">70%</div>
            </div>


            <div class="bar-row">
                <div class="label">iOS</div>
                <div class="bar ios">20%</div>
            </div>


            <div class="bar-row">
                <div class="label">Windows</div>
                <div class="bar windows">5%</div>
            </div>


            <div class="bar-row">
                <div class="label">Other</div>
                <div class="bar other">5%</div>
            </div>


        </div>


        <footer>
            © สงวนลิขสิทธิ์ พ.ศ. 2569 | 132-1 นายจิรายุ ชิยานุวัฒน์<br>
            สาขาวิศวกรรมคอมพิวเตอร์ คณะวิศวกรรมศาสตร์<br>
            มหาวิทยาลัยเทคโนโลยีราชมงคลพระนคร
        </footer>


    </div>

</body>

</html>
