<!DOCTYPE html>
<html lang="en">

<head>

    <title>Gallery</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: rgb(244, 248, 242);
        }

        .container {
            width: 1000px;
            margin: 30px auto;
            padding: 15px;
            text-align: center;
            background-color: white;
            border: 6px solid rgb(110, 146, 110);
        }

        table {
            width: 900px;
            margin: auto;
            border-spacing: 15px;
        }

        td {
            width: 200px;
            padding: 8px;
            vertical-align: top;
            border: 5px solid rgb(150, 176, 126);
            background-color: rgb(248, 251, 245);
            border-radius: 15px;
        }

        img {
            display: block;
            width: 200px;
            height: 130px;
            margin: 5px auto 8px;
            object-fit: cover;
            border-radius: 5px;
        }

        a {
            color: rgb(69, 101, 72);
            font-size: 15px;
            text-decoration: none;
        }

        h1 {
            width: 400px;
            margin: 0 auto 15px;
            padding: 5px;
            background-color: rgb(201, 222, 181);
            color: rgb(45, 50, 63);
            border: 1px solid rgb(110, 146, 110);
            border-radius: 25px;
        }

        hr {
            border: 0;
            border-top: 1px solid rgb(110, 146, 110);
        }
    </style>

</head>
