<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันข้อมูล</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8fafc;
            font-family: "Segoe UI", sans-serif;
        }

        .box {
            background: white;
            width: 420px;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .08);
        }

        .success {
            width: 65px;
            height: 65px;
            background: #22c55e;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: auto;
        }

        .box h2 {
            color: #1e293b;
            font-weight: 700;
            font-size: 26px;
        }

        .box p {
            color: #64748b;
        }

        .btn {
            border-radius: 10px;
            padding: 12px 35px;
        }

        .btn-primary {
            background: #3b82f6;
            border: none;
        }

        footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>

</head>

<body>

    <div class="container vh-100 d-flex justify-content-center align-items-center">

        <div class="box text-center">

            <div class="success">✓</div>

            <h2 class="mt-4">ส่งแบบสอบถามเรียบร้อย</h2>

            <p class="mt-2">
                ระบบได้รับข้อมูลของคุณแล้ว<br>
                ขอบคุณสำหรับการตอบแบบสอบถาม
            </p>

            <form action="google_form.html">
                <button class="btn btn-primary mt-3">ย้อนกลับไปหน้าแบบสอบถาม</button>
            </form>

            <footer>
                © สงวนลิขสิทธิ์ พ.ศ. 2569<br>
                132-1 นายจิรายุ ชิยานุวัฒน์<br>
                สาขาวิศวกรรมคอมพิวเตอร์<br>
                มหาวิทยาลัยเทคโนโลยีราชมงคลพระนคร
            </footer>

        </div>

    </div>

</body>

</html>
