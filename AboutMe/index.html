<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About Me</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Sarabun:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            font-family: "Sarabun", sans-serif;
            background-color: #eaf1f7;
        }

        .container {
            width: 500px;
            max-width: 100%;

            padding: 35px 40px;
            text-align: center;

            background-color: white;
            border: 3px solid #365b78;
            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .student-id {
            width: fit-content;
            margin: 0 auto 15px;
            padding: 8px 20px;

            color: white;
            background-color: #365b78;

            border-radius: 25px;

            font-family: "Poppins", sans-serif;
            font-size: 15px;
        }

        .image-frame {
            width: 230px;
            height: 295px;

            margin: auto;
            padding: 6px;

            background-color: #9fb8ca;
            border-radius: 25px;
        }

        .profile-image {
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center 20%;

            border: 4px solid white;
            border-radius: 20px;
        }

        h1 {
            margin: 20px 0 5px;

            color: #243b53;

            font-family: "Poppins", sans-serif;
            font-size: 28px;
        }

        .thai-name {
            margin: 0 0 15px;

            color: #627d98;

            font-size: 20px;
            font-weight: 600;
        }

        .line {
            width: 60px;
            height: 3px;

            margin: 0 auto 20px;

            background-color: #9fb3c8;
            border-radius: 10px;
        }

        .information {
            padding: 10px 20px;

            text-align: left;

            background-color: #f3f7fa;
            border: 1px solid #cfdce6;
            border-left: 5px solid #527a98;
            border-radius: 12px;
        }

        .information p {
            margin: 0;
            padding: 12px 5px;

            color: #334e68;

            font-size: 16px;
            font-weight: 600;
        }

        .information p:not(:last-child) {
            border-bottom: 1px solid #d9e2ec;
        }

        .footer {
            margin: 20px 0 0;

            color: #829ab1;

            font-family: "Poppins", sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
        }

        @media screen and (max-width: 550px) {
            body {
                padding: 15px;
                align-items: flex-start;
            }

            .container {
                padding: 30px 20px;
            }

            .image-frame {
                width: 190px;
                height: 245px;
            }

            h1 {
                font-size: 24px;
            }

            .information p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="student-id">
            ID 56950405132-1
        </div>

        <div class="image-frame">
            <img src="Jirayu.png" alt="รูปโปรไฟล์ Jirayu Chiyanuwat" class="profile-image">
        </div>

        <h1>Jirayu Chiyanuwat</h1>

        <p class="thai-name">
            จิรายุ ชิยานุวัฒน์
        </p>

        <div class="line"></div>

        <div class="information">
            <p>สาขาวิศวกรรมคอมพิวเตอร์</p>
            <p>คณะวิศวกรรมศาสตร์</p>
            <p>มหาวิทยาลัยเทคโนโลยีราชมงคลพระนคร</p>
        </div>

        <p class="footer">
            COMPUTER ENGINEERING • RMUTP
        </p>

    </div>

</body>

</html>
